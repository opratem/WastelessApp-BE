spring.application.name=WastelessApp-BE

# Database Configuration (Supabase PostgreSQL)
# Set these environment variables in your hosting platform (Render, Railway, etc.):
# - SUPABASE_DB_URL: jdbc:postgresql://db.[project-ref].supabase.co:5432/postgres?sslmode=require&prepareThreshold=0
# - SUPABASE_DB_USERNAME: neondb_owner
# - SUPABASE_DB_PASSWORD: your-database-password
spring.datasource.url=${NEON_DB_URL:${DATABASE_URL}}
spring.datasource.username=${NEON_DB_USERNAME:postgres}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# SSL Configuration for Supabase (required)
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Connection Pool Configuration (optimized for Supabase free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization (for sample donation centers data)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Spoonacular API Configuration
spoonacular.api.base-url=${SPOONACULAR_API_BASE_URL:https://api.spoonacular.com}
spoonacular.api.key=${SPOONACULAR_API_KEY}

# Server Configuration (Render uses PORT environment variable)
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.wasteless.backend=INFO
