version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wasteless-db
    environment:
      - POSTGRES_DB=wasteless_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pelunmi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasteless-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasteless-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wasteless_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pelunmi
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=your-secret-key-here-change-in-production-minimum-256-bits
      - JWT_EXPIRATION=86400000
      - SPOONACULAR_API_KEY=46e8627295314894b610e4ec2cac7658
      - SPOONACULAR_API_BASE_URL=https://api.spoonacular.com
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wasteless-network

volumes:
  postgres_data:

networks:
  wasteless-network:
    driver: bridge
