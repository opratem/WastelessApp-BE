services:
  # Backend - Spring Boot API
  - type: web
    name: wasteless-backend
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/*.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: SPOONACULAR_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: SPOONACULAR_API_BASE_URL
        value: https://api.spoonacular.com
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # Supabase Database Configuration
      # Set these manually in Render dashboard after creating Supabase project
      - key: SUPABASE_DB_URL
        sync: false  # Example: jdbc:postgresql://db.xxxx.supabase.co:5432/postgres
      - key: SUPABASE_DB_USERNAME
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false  # Your Supabase database password


